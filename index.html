<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>旅行フォトビンゴ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#3C3489; --purple-lt:#AFA9EC; --paper:#FFFDF8; --bg:#EFEBE1;
  --ink:#2C2C2A; --muted:#888780;
  --c-it:#EEEDFE; --t-it:#3C3489;
  --c-ch:#E1F5EE; --t-ch:#085041;
  --c-pp:#F4C0D1; --t-pp:#72243E;
  --c-fd:#FAEEDA; --t-fd:#633806;
  --c-nt:#EAF3DE; --t-nt:#27500A;
  --c-ot:#F1EFE8; --t-ot:#444441;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px 90px;}

/* ---------- header ---------- */
.hd{text-align:center;padding:10px 0 4px;}
.hd .deco{font-size:11px;letter-spacing:6px;color:#7F77DD;font-weight:700;}
.hd h1{font-size:24px;font-weight:900;letter-spacing:3px;color:var(--purple);}
.hd .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ---------- name select ---------- */
.namegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;}
.namebtn{background:var(--paper);border:2.5px solid var(--purple);border-radius:16px;
  padding:18px 8px;font-size:17px;font-weight:700;color:var(--purple);
  box-shadow:0 3px 0 rgba(60,52,137,.25);transition:transform .08s;}
.namebtn:active{transform:translateY(2px);box-shadow:none;}

/* ---------- card ---------- */
.card{background:var(--paper);border:4px solid var(--purple);border-radius:20px;
  padding:12px 10px;position:relative;margin-top:12px;}
.card::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--purple-lt);
  border-radius:14px;pointer-events:none;}
.boardscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;min-width:560px;}
.bc{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:9.5px;line-height:1.25;padding:2px;overflow:hidden;
  word-break:break-all;border:1px solid rgba(44,44,42,.10);position:relative;font-weight:500;}
.bc.pp{font-weight:700;}
.bc .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.bc .done{position:absolute;right:2px;bottom:2px;width:15px;height:15px;border-radius:50%;
  background:var(--purple);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
.bc.editable{cursor:pointer;}
.frcell{background:var(--paper);border:1.5px dashed #B4B2A9;}
.hole{width:80%;height:80%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#55504A 0%,#35322D 55%,#1F1D1A 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 #fff;}
.hole span{color:var(--paper);font-weight:900;font-size:9px;letter-spacing:1px;
  transform:rotate(-12deg);}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 12px;margin-top:10px;
  font-size:10.5px;color:#5F5E5A;}
.lg span{display:flex;align-items:center;gap:4px;}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(44,44,42,.12);}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--paper);border:2.5px solid var(--purple);border-radius:14px;
  padding:10px 14px;margin-top:12px;}
.statusbar .who{font-weight:900;font-size:15px;color:var(--purple);}
.statusbar .cnt{font-size:13px;font-weight:700;}
.statusbar .cnt b{font-size:18px;color:var(--purple);}
.smallbtn{background:none;border:1.5px solid var(--muted);border-radius:10px;
  padding:4px 10px;font-size:11px;color:var(--muted);}
.notice{margin-top:10px;background:#FAEEDA;color:#633806;border-radius:12px;
  padding:10px 14px;font-size:12.5px;line-height:1.6;}
.notice.err{background:#FCEBEB;color:#791F1F;}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);
  border-top:3px solid var(--purple);z-index:20;}
.tabs button{flex:1;padding:12px 0 max(12px, env(safe-area-inset-bottom));background:none;border:none;
  font-size:13px;font-weight:700;color:var(--muted);}
.tabs button.on{color:var(--purple);}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,28,45,.55);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--paper);border:4px solid var(--purple);border-radius:20px;
  width:100%;max-width:400px;max-height:88vh;overflow-y:auto;padding:18px;}
.modal h3{font-size:17px;font-weight:900;color:var(--purple);text-align:center;}
.modal .cattag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;
  padding:2px 8px;margin:6px auto 0;}
.modal .center{text-align:center;}
.preview{width:100%;border-radius:12px;margin-top:12px;display:block;}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.btn{border-radius:12px;padding:13px;font-size:15px;font-weight:700;border:none;}
.btn.primary{background:var(--purple);color:#fff;box-shadow:0 3px 0 #26215C;}
.btn.primary:active{transform:translateY(2px);box-shadow:none;}
.btn.ghost{background:none;border:2px solid var(--purple);color:var(--purple);}
.btn.danger{background:none;border:2px solid #A32D2D;color:#A32D2D;}
.btn.plain{background:none;border:none;color:var(--muted);font-size:13px;}
.btn:disabled{opacity:.45;pointer-events:none;}

/* ---------- results ---------- */
.rank{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.rankrow{display:flex;align-items:center;gap:10px;background:var(--paper);
  border:2.5px solid var(--purple);border-radius:14px;padding:12px 14px;}
.rankrow.locked{border-color:#D3D1C7;}
.rankrow .pos{font-size:20px;font-weight:900;color:var(--purple);min-width:34px;text-align:center;}
.rankrow .nm{font-weight:700;font-size:15px;flex:1;}
.rankrow .detail{font-size:11px;color:var(--muted);}
.rankrow .score{font-size:21px;font-weight:900;color:var(--purple);}
.rankrow .score small{font-size:11px;font-weight:700;}
.rankrow.clickable{cursor:pointer;}
.progress{height:7px;background:#EDEAE0;border-radius:4px;overflow:hidden;margin-top:4px;}
.progress i{display:block;height:100%;background:var(--purple-lt);border-radius:4px;}
.crown{font-size:18px;}
.backbtn{margin-top:12px;}
h2.sec{font-size:16px;font-weight:900;color:var(--purple);margin-top:18px;
  border-left:5px solid #7F77DD;padding-left:9px;}
.countdown{background:var(--paper);border:2.5px dashed var(--purple);border-radius:14px;
  padding:14px;text-align:center;margin-top:12px;font-size:13px;line-height:1.7;}
.countdown b{font-size:17px;color:var(--purple);}

/* ---------- name colors ---------- */
.namebtn.boy{border-color:#2E63B0;color:#2E63B0;box-shadow:0 3px 0 rgba(46,99,176,.25);}
.namebtn.girl{border-color:#C23A3A;color:#C23A3A;box-shadow:0 3px 0 rgba(194,58,58,.25);}

/* ---------- rules / topics ---------- */
.rules{background:var(--paper);border:2.5px solid var(--purple);border-radius:14px;
  margin-top:12px;padding:12px 14px;font-size:12.5px;line-height:1.9;}
.rules h3{color:var(--purple);font-size:14px;margin-bottom:4px;}
.rules ol{margin-left:20px;}
.topics{background:var(--paper);border:2.5px solid var(--purple);border-radius:14px;
  margin-top:12px;padding:10px 14px;}
.topics summary{font-weight:900;color:var(--purple);cursor:pointer;font-size:13.5px;padding:4px 0;}
.topicgroup{margin-top:10px;}
.topichead{font-size:12px;font-weight:900;}
.chips{margin-top:4px;}
.chip{display:inline-block;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;
  margin:2px 2px 0 0;border:1px solid rgba(44,44,42,.08);}

/* ---------- score box / history ---------- */
.scorebox{background:var(--paper);border:2.5px solid var(--purple);border-radius:14px;
  margin-top:12px;padding:12px 14px;text-align:center;}
.scorehead{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:2px;}
.scorenum{font-size:15px;font-weight:700;}
.scorenum b{font-size:34px;color:var(--purple);}
.scoredetail{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;}
.histbox{background:var(--paper);border:2.5px solid var(--purple);border-radius:14px;
  margin-top:12px;padding:10px 14px;}
.histhead{font-size:13px;font-weight:900;color:var(--purple);}
.histline{font-size:12px;margin-top:6px;line-height:1.6;}
.histtime{color:var(--muted);font-size:10.5px;margin-right:4px;}

/* ---------- NG / OK mark / password ---------- */
.bc.ngcell{outline:2.5px solid #C22B2B;outline-offset:-2px;}
.ngmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#C22B2B;background:rgba(255,255,255,.42);
  text-shadow:0 1px 0 rgba(255,255,255,.8);pointer-events:none;}
.bc.okcell{outline:2.5px solid #2F9E63;outline-offset:-2px;}
.okmark{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;
  background:#2F9E63;color:#fff;font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;pointer-events:none;}
.btn.ok{background:#2F9E63;color:#fff;box-shadow:0 3px 0 #1E6B42;}
.btn.ok:active{transform:translateY(2px);box-shadow:none;}
.marklegend{margin-top:8px;text-align:center;font-size:10.5px;color:#5F5E5A;}
.passinput{display:block;width:170px;margin:14px auto 0;padding:10px;font-size:26px;font-weight:900;
  text-align:center;letter-spacing:8px;border:2.5px solid var(--purple);border-radius:12px;
  font-family:inherit;background:var(--paper);color:var(--ink);}
.passinput:focus{outline:3px solid var(--purple-lt);}

.loading{text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}
.hidden{display:none!important;}
@media (min-width:640px){
  .bgrid{min-width:0;}
  .bc{font-size:12px;}
  .hole span{font-size:12px;}
  .hd h1{font-size:30px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="deco">★ PHOTO BINGO ★</div>
    <h1>旅行フォトビンゴ</h1>
    <div class="sub" id="subline">お題の写真を撮ってマスを埋めよう！｜満点100点</div>
  </div>
  <div id="app"><div class="loading">読み込み中…</div></div>
</div>

<div class="tabs hidden" id="tabs">
  <button id="tab-board" class="on">マイビンゴ</button>
  <button id="tab-results">みんなの状況</button>
</div>

<script type="module">
/* ============================================================
   ▼▼▼ 設定：ここだけ書き換えればOK ▼▼▼
============================================================ */

// ① メンバー8人の名前（好きに書き換えてください）
const MEMBERS = ["かんじ","そら","わか","いむた","ゆりな","おん","もえ","あずみん"];

// ①-2 名前ボタンが青色になるメンバー（男子）。ここに無い名前は赤色（女子）になる
const MALE_MEMBERS = new Set(["かんじ","そら","わか","いむた"]);

// ② 結果発表日時（この日時を過ぎると全員のビンゴと点数が見られる）
const RESULTS_AT = new Date("2026-08-12T13:00:00+09:00");

// ③ ゲームマスター用パスワード（幹事だけが知っている番号に変えること）
//    ※ページのソースコードを見ると分かってしまうので、大事なパスワードは使わないこと
const GM_PASS = "2580";

// ④ Firebaseの設定（セットアップ手順.md 参照。貼り替えるまではこの端末だけのお試しモードで動く）
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDB7H1yNy-aFb4fwleAIbPxmhUfiDwo1UA",
  authDomain: "photo-bingo-4d3c1.firebaseapp.com",
  projectId: "photo-bingo-4d3c1",
};

/* ============================================================
   ▲▲▲ 設定ここまで ▲▲▲
============================================================ */

const CATS = {
  it:{name:"アイテム", bg:"var(--c-it)", tx:"var(--t-it)"},
  ch:{name:"キャラクター", bg:"var(--c-ch)", tx:"var(--t-ch)"},
  pp:{name:"人物・役職（実物のみOK）", bg:"var(--c-pp)", tx:"var(--t-pp)"},
  fd:{name:"食べ物・飲み物", bg:"var(--c-fd)", tx:"var(--t-fd)"},
  nt:{name:"自然・風景", bg:"var(--c-nt)", tx:"var(--t-nt)"},
  ot:{name:"その他", bg:"var(--c-ot)", tx:"var(--t-ot)"},
};

const GRID = [
  [["fr","FREE"],["it","浴衣"],["fd","麻辣担"],["ch","ミャクミャク"],["pp","ホスト"],["nt","打ち上げ花火"],["ot","ボンドロシール"],["fr","FREE"]],
  [["ch","パペット\nスンスン"],["pp","ビデオ通話中の外国人"],["nt","虹"],["ot","宇宙兄弟46巻"],["fd","白黒ポテチ"],["it","タンクトップ"],["ch","水タイプの\nポケモン"],["pp","リュックの\nおじいちゃん"]],
  [["fd","ドライカレー"],["it","サッカーの\nユニフォーム"],["ch","たまごっち"],["pp","ジーンズの\nヤリラ"],["nt","ピンク色の空"],["ot","ジグソーパズル"],["fd","かき氷"],["it","ドクロの服"]],
  [["nt","積乱雲"],["ot","1桁の\nナンバープレート"],["fd","スパイス\nほりにし"],["it","鼻ピアス"],["ch","飛び出し坊や"],["pp","初恋の相手"],["nt","猫"],["ot","ストリート\nピアノ"]],
  [["ot","昆虫食の自販機"],["nt","シマエナガ"],["pp","高卒"],["ch","ちいかわ"],["it","アームカバー"],["fd","ミックスソフト"],["ot","紙の切符"],["nt","セミの抜け殻"]],
  [["it","カラコン"],["fd","黄色いアクエリ"],["ot","タイ語表記"],["nt","田んぼ"],["pp","変顔"],["ch","任天堂の\n黄色キャラ"],["it","首かけ扇風機"],["fd","マンジャロ"]],
  [["pp","半袖の\nサラリーマン"],["ch","いらすとやの\nデザイン"],["it","黒色の傘"],["fd","トルネード\nポテト"],["ot","かさぶた"],["nt","蜃気楼"],["pp","ドレッドヘア"],["ch","リカちゃん人形"]],
  [["fr","FREE"],["ot","お地蔵さん"],["nt","砂浜のある海"],["pp","ファミマの靴下\n履いてる人"],["ch","サンリオ"],["fd","トリュフ味の\nお菓子"],["it","VRゴーグル"],["fr","FREE"]],
];

const CELLS = [];
GRID.forEach((row,r)=>row.forEach(([cat,label],c)=>{
  CELLS.push({id:`r${r}c${c}`, r, c, cat, label});
}));
const FREE_IDS = new Set(CELLS.filter(x=>x.cat==="fr").map(x=>x.id));

/* ---------- ストレージ層（Firebase or お試しローカル） ---------- */
let store;
const configured = FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId !== "ここに貼り付け";

if (configured) {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = initializeApp(FIREBASE_CONFIG);
  const db = fs.getFirestore(app);
  store = {
    demo:false,
    listenBoards(cb){
      return fs.onSnapshot(fs.collection(db,"boards"), snap=>{
        const out={}; snap.forEach(d=>out[d.id]=d.data()); cb(out);
      });
    },
    async setFilled(name, id, on){
      await fs.setDoc(fs.doc(db,"boards",name),
        {filled:{[id]: on ? true : fs.deleteField()},
         photoTs:{[id]: on ? Date.now() : fs.deleteField()},   // 写真の版（キャッシュ更新の合図）
         updatedAt: Date.now()},
        {merge:true});
    },
    async setPass(name, pass){
      await fs.setDoc(fs.doc(db,"boards",name),{pass, updatedAt: Date.now()},{merge:true});
    },
    async setJudge(name, id, verdict, label, type){   // verdict: "ok" | "ng" | null（チェック待ちに戻す）
      const entry={id, label, ts:Date.now(), type};
      await fs.setDoc(fs.doc(db,"boards",name),
        {ok:{[id]: verdict==="ok" ? {ts:entry.ts} : fs.deleteField()},
         ng:{[id]: verdict==="ng" ? {ts:entry.ts} : fs.deleteField()},
         log: fs.arrayUnion(entry), updatedAt: Date.now()},
        {merge:true});
    },
    async savePhoto(name,id,img){ await fs.setDoc(fs.doc(db,"photos",`${name}_${id}`),{img,ts:Date.now()}); },
    async getPhoto(name,id){
      const d = await fs.getDoc(fs.doc(db,"photos",`${name}_${id}`));
      return d.exists() ? d.data().img : null;
    },
    async deletePhoto(name,id){ await fs.deleteDoc(fs.doc(db,"photos",`${name}_${id}`)); },
  };
} else {
  const K="pbingo_demo";
  const load=()=>JSON.parse(localStorage.getItem(K)||'{"boards":{},"photos":{}}');
  const save=d=>localStorage.setItem(K,JSON.stringify(d));
  let notify=()=>{};
  store = {
    demo:true,
    listenBoards(cb){ notify=()=>cb(load().boards); notify(); return ()=>{}; },
    async setFilled(name,id,on){
      const d=load(); d.boards[name]??={filled:{}};
      d.boards[name].photoTs??={};
      if(on){ d.boards[name].filled[id]=true; d.boards[name].photoTs[id]=Date.now(); }
      else { delete d.boards[name].filled[id]; delete d.boards[name].photoTs[id]; }
      d.boards[name].updatedAt=Date.now(); save(d); notify();
    },
    async setPass(name,pass){
      const d=load(); d.boards[name]??={filled:{}};
      d.boards[name].pass=pass; d.boards[name].updatedAt=Date.now(); save(d); notify();
    },
    async setJudge(name,id,verdict,label,type){
      const d=load(); d.boards[name]??={filled:{}};
      d.boards[name].ok??={}; d.boards[name].ng??={}; d.boards[name].log??=[];
      if(verdict==="ok") d.boards[name].ok[id]={ts:Date.now()}; else delete d.boards[name].ok[id];
      if(verdict==="ng") d.boards[name].ng[id]={ts:Date.now()}; else delete d.boards[name].ng[id];
      d.boards[name].log.push({id,label,ts:Date.now(),type});
      d.boards[name].updatedAt=Date.now(); save(d); notify();
    },
    async savePhoto(name,id,img){ const d=load(); d.photos[`${name}_${id}`]=img; save(d); },
    async getPhoto(name,id){ return load().photos[`${name}_${id}`]||null; },
    async deletePhoto(name,id){ const d=load(); delete d.photos[`${name}_${id}`]; save(d); notify(); },
  };
}

/* ---------- 得点計算（×にされたマスは埋まっていない扱い） ---------- */
function calcScore(filled, ng){
  filled=filled||{}; ng=ng||{};
  const has = id => FREE_IDS.has(id) || (!!filled[id] && !ng[id]);
  const n = Object.keys(filled).filter(id=>!FREE_IDS.has(id) && !ng[id]).length;
  let lines=0;
  for(let r=0;r<8;r++){ if([...Array(8)].every((_,c)=>has(`r${r}c${c}`))) lines++; }
  for(let c=0;c<8;c++){ if([...Array(8)].every((_,r)=>has(`r${r}c${c}`))) lines++; }
  if([...Array(8)].every((_,i)=>has(`r${i}c${i}`))) lines++;
  if([...Array(8)].every((_,i)=>has(`r${i}c${7-i}`))) lines++;
  return { filledCount:n, lines, score: n + 4 + lines*2 };
}

/* ---------- 画像圧縮（画質優先：長辺1400px・高画質から順に試して90万文字以下に収める） ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(img.src);   // 元画像のメモリを解放
      const LIMIT=900000;   // Firestoreルール（100万文字未満）に余裕をもたせた上限
      const TRIES=[[1400,.82],[1400,.74],[1280,.8],[1280,.72],[1120,.78],[1120,.7],
                   [1000,.74],[1000,.66],[900,.7],[900,.6],[800,.6],[700,.55],[700,.45]];
      const seen=new Set();
      let last=null;
      for(const [side,q] of TRIES){
        const k=Math.min(1, side/Math.max(img.width,img.height));   // 元が小さい写真は拡大しない
        const w=Math.round(img.width*k), h=Math.round(img.height*k);
        const key=`${w}x${q}`;
        if(seen.has(key)) continue;
        seen.add(key);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        last=cv.toDataURL("image/jpeg",q);
        if(last.length<=LIMIT) return res(last);
      }
      if(last && last.length<980000) return res(last);
      rej(new Error("画像を小さくできませんでした"));
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); rej(new Error("画像を読み込めませんでした")); };
    img.src=URL.createObjectURL(file);
  });
}

function render(){
  renderGen++;   // 古い非同期ループはこの番号の変化で自動停止する
  // ログイン中でもパスワードが一致しなくなったら（未設定含む）パスワード画面へ
  if(me){
    const p=boards[me]?.pass;
    if(!p || p!==authPass){ pendingName=me; me=null; view="pass"; }
  }
  // パスワード入力中は再描画しない（他の人の更新で入力が消えないように）
  if(view==="pass" && document.getElementById("pin")) return;
  if(view==="gm" && !gmOK && document.getElementById("gmpin")) return;

  document.getElementById("tab-board").classList.toggle("on",view==="board");
  document.getElementById("tab-results").classList.toggle("on",view==="results"||view.startsWith("player:"));
  const noTabs = !me || view==="pass" || view==="gm" || view==="gmdemo" || view.startsWith("gmplayer:");
  tabs.classList.toggle("hidden",noTabs);

  if(view==="pass") return renderPass();
  if(view==="gm") return gmOK ? renderGM() : renderGMPass();
  if(view==="gmdemo") return gmOK ? renderDemoBoard() : renderGMPass();
  if(view.startsWith("gmplayer:")) return gmOK ? renderGMBoard(view.slice(9)) : renderGMPass();
  if(!me) return renderNamePick();
  if(view==="board") renderBoard();
  else if(view==="results") renderResults();
  else if(view.startsWith("player:")) renderPlayerBoard(view.slice(7));
}

/* ---------- マスのモーダル（owner/cacheを指定するとGMお試しボードでも使える） ---------- */
function openSquare(id, owner=me, cache=myPhotos){
  const cell=CELLS.find(c=>c.id===id);
  const cat=CATS[cell.cat];
  const label=cell.label.replace(/\n/g,"");
  const filled=boards[owner]?.filled||{};
  const has=!!filled[id];
  const isNg=has && !!boards[owner]?.ng?.[id];
  const isOk=has && !isNg && !!boards[owner]?.ok?.[id];
  const ov=document.createElement("div");
  ov.className="overlay";
  ov.innerHTML=`
    <div class="modal">
      <h3>${label}</h3>
      <div class="center"><span class="cattag" style="background:${cat.bg};color:${cat.tx};">${cat.name}</span></div>
      ${isNg?`<div class="notice err" style="margin-top:10px;">❌ この写真はゲームマスターに<b>×</b>にされたよ。お題に合う写真に撮り直してね！（撮り直すまで点数に入らないよ）</div>`:""}
      ${isOk?`<div class="notice" style="margin-top:10px;background:#E1F5EE;color:#085041;">⭕ この写真はゲームマスターに<b>〇</b>をもらってるよ！</div>`:""}
      <img class="preview ${has?"":"hidden"}" id="pv">
      <div class="mbtns">
        <input type="file" accept="image/*" id="file" class="hidden">
        <button class="btn primary" id="pick">${has?"写真を撮り直す / 選び直す":"写真を撮る / 選ぶ"}</button>
        <button class="btn primary hidden" id="save">この写真で保存</button>
        <button class="btn danger ${has?"":"hidden"}" id="del">写真を削除</button>
        <button class="btn plain" id="close">閉じる</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const $=s=>ov.querySelector(s);
  let pending=null;
  if(has){ store.getPhoto(owner,id).then(img=>{ if(img){cache[id]=img; $("#pv").src=img;} }).catch(()=>{}); }
  $("#pick").onclick=()=>$("#file").click();
  $("#file").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    $("#pick").disabled=true; $("#pick").textContent="読み込み中…";
    try{
      pending=await compress(f);
      $("#pv").src=pending; $("#pv").classList.remove("hidden");
      $("#save").classList.remove("hidden");
      $("#pick").textContent="別の写真にする";
    }catch(err){ alert(err.message); }
    $("#pick").disabled=false;
  };
  // 判定はモーダルを開いている間にGMが付けることがあるので、ボタンを押した時点の最新値で見る
  const curJudge=()=>{
    const n=!!boards[owner]?.ng?.[id];
    return {ng:n, ok:!n && !!boards[owner]?.ok?.[id], any:!!(boards[owner]?.ng?.[id]||boards[owner]?.ok?.[id])};
  };
  $("#save").onclick=async()=>{
    const cur=curJudge();
    if(cur.ok && !confirm(`この写真はゲームマスターに〇をもらってるよ。\n写真を変えると判定なし（チェック待ち）に戻るけど、変えちゃう？`)) return;
    $("#save").disabled=true; $("#save").textContent="保存中…";
    try{
      await store.savePhoto(owner,id,pending);
      await store.setFilled(owner,id,true);
      if(curJudge().any) await store.setJudge(owner,id,null,label,"redo");   // 撮り直したら判定はリセット
      cache[id]=pending;
      delete gmPhotos[`${owner}_${id}`];
      ov.remove();
    }catch(err){ alert("保存に失敗しました: "+err.message); $("#save").disabled=false; $("#save").textContent="この写真で保存"; }
  };
  $("#del").onclick=async()=>{
    const cur=curJudge();
    if(!confirm(cur.ok
      ?`この写真はゲームマスターに〇をもらってるよ。\n本当に削除する？（〇も消えて、点数も減るよ）`
      :"この写真を削除する？")) return;
    try{
      await store.deletePhoto(owner,id);
      await store.setFilled(owner,id,false);
      if(curJudge().any) await store.setJudge(owner,id,null,label,"del");    // 判定付きの写真を消したら判定も解除
      delete cache[id];
      delete gmPhotos[`${owner}_${id}`];
      ov.remove();
    }catch(err){ alert("削除に失敗しました: "+err.message); }
  };
  $("#close").onclick=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}

      ${CELLS.map(c=>cellHtml(c,{},filled,false,ng,ok)).join("")}
    </div></div>${legendHtml()}</div>
    <button class="btn ghost backbtn" id="back" style="width:100%;">← 結果にもどる</button>
    <div class="loading" id="pl">写真を読み込み中…</div>`;
  const bs=app.querySelector(".boardscroll"); if(bs&&sc) bs.scrollLeft=sc;
  document.getElementById("back").onclick=()=>{ view="results"; render(); };
  for(const id of Object.keys(filled)){
    let img=null;
    try{ img=await getPhotoCached(name,id); }catch(e){}   // 1枚失敗しても残りは表示する
    if(gen!==renderGen) return;                           // 新しい描画が始まっていたら中断
    if(!img) continue;
    const el=app.querySelector(`.bc[data-id="${id}"]`);
    if(el) el.innerHTML=`<img class="ph" src="${img}" alt="">${ng[id]?`<span class="ngmark">×</span>`:ok[id]?`<span class="okmark">〇</span>`:""}`;
  }
  const pl=document.getElementById("pl"); if(pl) pl.remove();
}

async function gmSquare(name,id){
  const cell=CELLS.find(c=>c.id===id);
  const cat=CATS[cell.cat];
  const label=cell.label.replace(/\n/g,"");
  const isNg=!!boards[name]?.ng?.[id];
  const isOk=!isNg && !!boards[name]?.ok?.[id];
  const ov=document.createElement("div");
  ov.className="overlay";
  ov.innerHTML=`
    <div class="modal">
      <h3>${label}</h3>
      <div class="center">
        <span class="cattag" style="background:${cat.bg};color:${cat.tx};">${cat.name}</span>
        ${isOk?`<span class="cattag" style="background:#E1F5EE;color:#085041;">判定：〇</span>`:""}
        ${isNg?`<span class="cattag" style="background:#FCEBEB;color:#791F1F;">判定：×</span>`:""}
        ${!isOk&&!isNg?`<span class="cattag" style="background:#F1EFE8;color:#444441;">チェック待ち</span>`:""}
      </div>
      <img class="preview" id="gpv">
      <div class="mbtns">
        ${!isOk?`<button class="btn ok" id="mkok">⭕ 〇にする（問題なし！）</button>`:""}
        ${!isNg?`<button class="btn danger" id="mkng">❌ ×にする（撮り直しさせる）</button>`:""}
        ${isOk||isNg?`<button class="btn ghost" id="unj">判定を取り消す（チェック待ちに戻す）</button>`:""}
        <button class="btn plain" id="gclose">閉じる</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const q=s=>ov.querySelector(s);
  const done=()=>ov.remove();
  const seenTs=boards[name]?.photoTs?.[id] ?? null;   // モーダルを開いた時点の写真の版
  // 判定ボタンを押した瞬間に、本人が削除・撮り直ししていないか確認（誤判定防止）
  const stillSame=()=>{
    const b=boards[name]||{};
    if(!b.filled?.[id]){ alert("この写真は削除されたみたい。チェック画面を更新するね。"); done(); render(); return false; }
    if((b.photoTs?.[id] ?? null)!==seenTs){ alert("写真が撮り直されたみたい。もう一度開いて確認してね。"); done(); render(); return false; }
    return true;
  };
  if(q("#mkok")) q("#mkok").onclick=async()=>{
    if(!stillSame()) return;
    try{ await store.setJudge(name,id,"ok",label,"ok"); }catch(e){ alert("保存に失敗しました: "+e.message); return; }
    done();
  };
  if(q("#mkng")) q("#mkng").onclick=async()=>{
    if(!stillSame()) return;
    if(!confirm(`「${label}」の写真を×にする？\n本人の画面に×マークとお知らせが出て、撮り直すまで点数に入らなくなるよ。`)) return;
    try{ await store.setJudge(name,id,"ng",label,"ng"); }catch(e){ alert("保存に失敗しました: "+e.message); return; }
    done();
  };
  if(q("#unj")) q("#unj").onclick=async()=>{
    try{ await store.setJudge(name,id,null,label,"clear"); }catch(e){ alert("保存に失敗しました: "+e.message); return; }
    done();
  };
  q("#gclose").onclick=done;
  ov.onclick=e=>{ if(e.target===ov) done(); };
  // 写真はボタン配線のあとで読み込む（読み込み失敗や遅延でモーダルが操作不能にならないように）
  let img=null;
  try{ img=await getPhotoCached(name,id); }catch(e){}
  if(!ov.isConnected) return;
  if(img) q("#gpv").src=img; else q("#gpv").remove();
}
